name: Python Tests

on:
  push:
  pull_request:

jobs:
  test-python-projects:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - projects/forest-fire-detection
          - projects/data-mining
          - projects/arduino-radar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt

      - name: Install dependencies
        run: pip install -r ${{ matrix.project }}/requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: pytest -q
